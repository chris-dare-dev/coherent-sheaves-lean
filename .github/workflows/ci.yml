name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
  workflow_dispatch:

concurrency:
  # Deliberately still keyed on github.ref, so a push to agent/x and the
  # pull_request run for that branch stay in SEPARATE groups and both run. They
  # are not redundant: the push run is the fast one, the pull_request run is the
  # one that reports the status check the merge button reads. Collapsing them
  # under cancel-in-progress: true would make the two lanes race and cancel the
  # loser, which can be the PR check. The extra ubuntu-latest run is free on a
  # public repo. (Note also that the obvious collapse key does not collapse:
  # github.event.pull_request.head.ref is `agent/x` while github.ref is
  # `refs/heads/agent/x`; it would take github.head_ref || github.ref_name.)
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # self-hosted-fast-lane 2026-08-14 (issue #358): this repo is public, so
    # ubuntu-latest is free regardless of run volume -- self-hosted here is
    # purely for SPEED (persistent local .lake/build + mathlib cache instead of
    # a cold checkout every run), not cost avoidance.
    #
    # The fast lane rides on `push` and `workflow_dispatch` ONLY, and it is safe
    # because both events REQUIRE WRITE ACCESS TO PRODUCE AT ALL, and because the
    # workflow file a `push` event runs is the one on the pushed branch -- put
    # there by that same write-access holder. There is no attacker-controlled
    # copy of this expression anywhere in the path, so the routing is
    # structurally true rather than merely asserted.
    #
    # `pull_request` goes to ubuntu-latest unconditionally, with no fork check.
    # A fork check here cannot work: for `pull_request`, GitHub evaluates the
    # workflow from the PR's merge commit, i.e. from the contributor's copy of
    # this file, so any guard written here is the guard the contributor can
    # rewrite. The previous `head.repo.fork == false` condition read as a
    # protection but a PR editing this line to a bare self-hosted label would
    # have routed itself onto the owner's daily-driver Mac and executed there.
    # Never make self-hosted routing depend on anything a pull_request can edit.
    #
    # The fast lane also has a cost that is not speed: one machine means one
    # shared .lake/build. Concurrent CI runs -- and the owner building locally
    # at the same time -- contend for it and for memory. That contention is the
    # condition behind the 2026-08-07 truncated-audit incident recorded in
    # scripts/check_audit.py's docstring, where two audit runs died
    # mid-elaboration and left 661 and 558 of 677 commanded records, each
    # indistinguishable from a complete, smaller audit. Restricting the fast
    # lane to push/workflow_dispatch also reduces how many runs share it.
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && fromJSON('["self-hosted", "owner-mac"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build: true
          use-mathlib-cache: true
          nanoda: false

      - name: Pin and coverage records
        run: |
          set -euo pipefail
          python3 scripts/check_pin.py
          # Every coverage record, not a hand-maintained list of two. This PR
          # adds five, and under the old naming they would all have landed
          # unvalidated -- as would every record added after it.
          for f in registry/coverage-*.json; do
            python3 scripts/check_coverage_map.py "$f"
          done

      - name: Coherent-sheaf axiom audit
        run: |
          set -euo pipefail
          # The optional Development umbrella is outside CohLean's stable root;
          # build it explicitly before the later per-file re-elaboration sweep.
          lake build CohLean.Development \
            CohLean.Numerical.Specializations.Surface \
            CohLean.Numerical.Specializations.Threefold \
            CohLean.Numerical.Specializations.Fourfold
          lake env lean scripts/Audit.lean > coh-audit.txt 2>&1
          if grep -q 'sorryAx' coh-audit.txt; then
            echo "::error::sorryAx reached the coherent-sheaf audit"
            exit 1
          fi

      - name: Stability-condition axiom audit
        run: |
          set -euo pipefail
          lake env lean scripts/BridgelandAudit.lean > bridgeland-audit.txt 2>&1 || {
            echo "::error::scripts/BridgelandAudit.lean failed to elaborate"
            cat bridgeland-audit.txt
            exit 1
          }
          python3 scripts/check_audit.py bridgeland-audit.txt

      - name: DG axiom audit
        run: |
          set -euo pipefail
          lake env lean scripts/DGLeanAudit.lean > dg-audit.txt 2>&1 || {
            echo "::error::scripts/DGLeanAudit.lean failed to elaborate"
            cat dg-audit.txt
            exit 1
          }
          python3 scripts/check_audit.py dg-audit.txt scripts/DGLeanAudit.lean

      - name: Environment linters
        run: |
          set -euo pipefail
          lake exe runLinter BridgelandStability
          lake exe runLinter BridgelandStabLean
          # CohLean's pre-existing backlog is enumerated per declaration in
          # scripts/nolints.json, so this gate rejects anything NEW while the
          # 203 known violations stay visible and countable. Never silence a
          # failure with `runLinter --update`: that rewrites the whole file
          # from the current run and would bless the new violation along with
          # everything else. Fix the declaration, or argue for the exception.
          lake exe runLinter CohLean
          python3 scripts/check_nolints.py
          # DGLean is gated from its first commit and has no nolints entries.
          # Keep it that way: it is clean at 62 declarations, and CohLean shows
          # what retrofitting costs once a backlog exists.
          lake exe runLinter DGLean
          lake exe lint-style

      - name: Anchor-free import boundary
        run: python3 scripts/check_anchor_free.py

      - name: No declaration uses sorry
        run: |
          set -euo pipefail
          # This step used to be a serial `lake env lean` over every tracked
          # .lean file: 39m23s of a 54m01s run (72.9% of CI wall clock) spent
          # re-elaborating from source what the build step had just built. The
          # emitter below is both cheaper and stronger -- it reads the
          # environment, not the text a `set_option ... in` evasion hides in --
          # so the loop is now one file wide. See #361 and exe/Emit.lean.
          #
          # An `lean_exe` root cannot appear in an emission built from its own
          # imports, so exe/ is exactly what the emitter cannot reach and this
          # is exactly what is left of the loop. Keep the two in agreement:
          # scripts/check_emission_coverage.py excludes exe/ on the strength of
          # this step existing.
          # `lake env lean` does not build; it only sets LEAN_PATH. The exe root
          # imports the sweep umbrella, which is not a default target, so build
          # it here rather than depending on what an earlier step happened to
          # leave behind.
          lake build emit
          : > lean-source-check.txt
          for f in exe/*.lean; do
            lake env lean "$f" 2>&1 | tee -a lean-source-check.txt
          done
          if grep -q "declaration uses 'sorry'" lean-source-check.txt; then
            echo "::error::a declaration uses sorry"
            exit 1
          fi

      - name: Emit combined environment
        run: |
          set -euo pipefail
          lake build emit
          # Non-zero when any constant's axiom closure contains sorryAx. This is
          # the repository-wide sorry gate; the artifact is written either way.
          lake exe emit --out attest/lean-emission.json
          # ...and this is what keeps that gate from silently shrinking to a
          # scope where the claim is vacuously true. See the script's docstring.
          python3 scripts/check_emission_coverage.py attest/lean-emission.json
          python3 - <<'PY'
          import json
          d = json.load(open("attest/lean-emission.json", encoding="utf-8"))
          n = len(d["constants"])
          if n == 0:
              raise SystemExit("::error::empty emission -- the vacuous pass")
          print(f"ok: {n} constants, {d['counts']['in_scope']} in scope, "
                f"{sum(1 for c in d['constants'] if c['cites'])} cited")
          PY

      - name: Upload trust artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-artifacts
          path: |
            attest/lean-emission.json
            coh-audit.txt
            bridgeland-audit.txt
          if-no-files-found: warn
