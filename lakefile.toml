name = "DerivedAlgGeoLean"
version = "0.1.0"
defaultTargets = ["DerivedAlgGeoLean", "DGLean"]
keywords = [
  "math", "algebraic-geometry", "derived-categories",
  "coherent-sheaves", "stability-conditions", "riemann-roch",
]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# One direct Mathlib revision for every library in this repository.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.1"

# Shared provenance/emission leaf. It has no Lake dependencies, so it cannot
# introduce a competing Mathlib revision.
[[require]]
name = "MathFormalContract"
git = "https://github.com/chris-dare-dev/math-formal-contract-lean"
rev = "65d600b1e70e403e8bcb43975e6aa178ee5ba439"

[[lean_lib]]
name = "CohLean"

[[lean_lib]]
name = "BridgelandStabLean"

# Dg categories and enhancements. It is a default target so `lake build`
# produces its oleans -- the "No declaration uses sorry" job runs
# `lake env lean` over every tracked .lean file, and DGLean.lean cannot even
# be read without them. Being a default target is separate from being imported
# by DerivedAlgGeoLean.lean, which it deliberately is not until the subsystem
# is stable; see DGLean.lean and ADR-0010.
[[lean_lib]]
name = "DGLean"

# Stable umbrella for the combined environment.
[[lean_lib]]
name = "DerivedAlgGeoLean"

# Sweep umbrella for `lake exe emit`. Separate from the stable umbrella because
# the sorry gate must cover unstable and unimported code, which is exactly what
# DerivedAlgGeoLean.lean is supposed to exclude. See DerivedAlgGeoSweep.lean.
[[lean_lib]]
name = "DerivedAlgGeoSweep"

# The coherent-sheaf and stability-condition audits remain independent so
# their historical declaration lists and truncation checks stay meaningful.
[[lean_lib]]
name = "Audit"
srcDir = "scripts"

[[lean_lib]]
name = "BridgelandAudit"
srcDir = "scripts"

[[lean_lib]]
name = "DGLeanAudit"
srcDir = "scripts"

[[lean_exe]]
name = "emit"
root = "Emit"
srcDir = "exe"
supportInterpreter = true
