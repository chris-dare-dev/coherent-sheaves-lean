name = "CohLean"
version = "0.1.0"
defaultTargets = ["CohLean"]
keywords = ["math", "algebraic-geometry", "coherent-sheaves", "riemann-roch"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Mathlib v4.32.0 is the first stable release containing
# Mathlib/AlgebraicGeometry/AlgebraicCycle/Basic.lean and
# Mathlib/AlgebraicGeometry/OrderOfVanishing.lean. We use the v4.32.1 patch
# release. Downstream consumers bridgeland-stab-lean and bstab must use the
# same Lean/Mathlib line before requiring this package.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.1"

[[lean_lib]]
name = "CohLean"
