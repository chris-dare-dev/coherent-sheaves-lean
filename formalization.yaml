  sorry_details: >
    None. The NormalizedShift group structure is PROVED, not asserted: it was
    left undeclared in the initial skeleton and closed on 2026-08-03. The
    standing rule stays -- a result that is not yet proved is left undeclared
    with a TODO, never declared with sorry, because a sorry-backed instance
    typechecks, gets imported, and launders an unproved claim downstream.
    CLOSED 2026-08-05: simple connectedness of GLTilde. StabilityCondition/Symmetry/GLTilde/Covering/SourceTopology.lean
    gives global coordinates
    R x (0,infinity) x R x (0,infinity): rotate the first column back through
    the lifted phase f(0), leaving an upper-triangular matrix with two positive
    diagonal entries. The inverse construction normalizes the canonical lift
    of that upper-triangular matrix at zero. The coordinate map is proved
    bijective, the product topology is transported through the resulting
    homeomorphism, and ContractibleSpace GLTilde and SimplyConnectedSpace
    GLTilde are declared. GLTilde.mat is also proved continuous. This proof
    does NOT need a computation of pi_1(S^1), and it does not use the polar
    decomposition; ForMathlib/LinearAlgebra/Matrix/PolarDecomposition.lean remains an independent,
    more general matrix result.

    The other two group-theoretic facts were CLOSED 2026-08-04: the Z fibre in
    StabilityCondition/Symmetry/GLTilde/Covering/Fibre.lean and surjectivity of the projection in
    StabilityCondition/Symmetry/GLTilde/Covering/Surjectivity.lean. Together they give the exact sequence
    1 -> Z -> GLTilde -> GL+(2,R) -> 1.

    CLOSED 2026-08-05: the covering-map property. StabilityCondition/Symmetry/GLTilde/Covering/Map.lean gives
    GL+(2,R) global coordinates S^1 x (0,infinity) x R x (0,infinity) and
    proves that GLTilde.mat is conjugate, through the source and base
    coordinate homeomorphisms, to (theta |-> exp(pi theta)) x id. Mathlib's
    standard circle exponential cover, stability under products with an
    identity, and stability under coordinate homeomorphisms yield
    GLTilde.isCoveringMap_toMat. GLTilde.universalCoverData packages
    IsCoveringMap GLTilde.mat, surjectivity, and SimplyConnectedSpace GLTilde;
    the earlier exact_deckHom_toMatHom separately records the Z fibre as part
    of the algebraic exact sequence.

    CLOSED 2026-08-06: topological-group compatibility.
    StabilityCondition/Symmetry/GLTilde/Topology/Group.lean proves joint continuity of phase evaluation
    (x,phi) |-> x.shift(phi). In global coordinates the possibly
    branch-sensitive arg(cA) term cancels, leaving only arg(W(phi)) -
    arg(W(0)); every W lies in the open right half-plane where arg is
    continuous. Matrix multiplication and joint phase evaluation then give
    continuous multiplication. Inversion is handled by the explicit inverse
    positive-diagonal upper-triangular coordinates. The resulting declaration
    is IsTopologicalGroup GLTilde.

    CLOSED 2026-08-06: normalized quotient and combined symmetry action.
    StabilityCondition/Symmetry/Autoequivalence/Slicing/Quotient.lean now imports right-adjoint uniqueness and proves
    TriEquiv.inverseIsoOfFunctorIso, so AutQuot and AutPairQuot quotient only
    by natural isomorphism of the forward functors. StabilityCondition/Symmetry/Combined/Action.lean proves
    the GLTilde and AutPairQuot actions commute and supplies
    MulAction (GLTilde x AutPairQuot v) (StabilityCondition.WithClassMap C v).

    CLOSED 2026-08-06: fixed-element topological action layer.
    StabilityCondition/Symmetry/Combined/Topology.lean proves forward control of slicingDist and
    stabSeminorm under a compatible autoequivalence pair, giving
    ContinuousConstSMul for AutPairQuot and a homeomorphism for each class.
    StabilityCondition/Symmetry/GLTilde/Action/Continuous.lean combines uniform continuity of the normalized
    phase lift with operator-norm bounds for actC and actC-inverse, giving the
    corresponding ContinuousConstSMul and homeomorphisms for GLTilde and for
    the direct-product action.

    CLOSED 2026-08-06: jointly continuous symmetry actions.
    StabilityCondition/Symmetry/GLTilde/Action/JointContinuous.lean proves that phase displacement is
    uniformly small on all of R near the identity (compactness on [0,1] plus
    integer equivariance), that the central-charge operator varies
    continuously in operator norm, and that these estimates control one
    Bridgeland basic neighborhood uniformly in the nearby group element.
    Translation from the identity gives ContinuousSMul GLTilde on the
    stability space. AutPairQuot carries the standard discrete topology, so
    its action and the combined GLTilde x AutPairQuot action also have
    ContinuousSMul instances.

    CLOSED 2026-08-06: component transport, equivariant period coordinates,
    and the effective symmetry quotient. StabilityCondition/Symmetry/Combined/Components.lean transports
    connected-component labels, restricts symmetries to homeomorphisms between
    component subtypes, and equips each component stabilizer with an action on
    that component. StabilityCondition/Symmetry/Combined/PeriodMap.lean packages the additive action on
    the charge space and proves equivariance of the full central-charge map and
    the canonical component local-model chart. StabilityCondition/Symmetry/Combined/Effective.lean constructs
    the categorical double shift as a triangulated autoequivalence, proves it
    is trivial on K0, and fixes the convention `[2] = deck (-1)` at the level
    of actions. Thus `(deck 1, [2])` is in the combined action kernel. The
    quotient by the full kernel acts faithfully; no claim says this explicit
    overlap generates the full kernel in every category.

    CLOSED IN PART 2026-08-06: the full-coordinate metric and isometry track.
    StabilityCondition/Metric/Isometry/Phase.lean first proved exact preservation of the foundational library's
    phase-only slicingDist. StabilityCondition/Metric/Mass/Basic.lean now defines the finite charge-
    norm sum of an HN filtration and a choice-free mass envelope as the
    supremum over all HN filtrations; it proves positivity, isomorphism
    invariance, and exact transport by a compatible autoequivalence.
    StabilityCondition/Metric/Distance/Basic.lean adds the logarithmic mass coordinate to phi-plus
    and phi-minus, then proves reflexivity, symmetry, the triangle inequality,
    and slicingDist <= stabilityDist. StabilityCondition/Metric/Isometry/Full.lean proves exact
    preservation by representatives and by AutPairQuot v.

    StabilityCondition/Metric/Mass/Uniqueness.lean now closes the mass-identification gap without an
    added axiom. It constructs the highest-factor/tail triangle of an HN
    filtration by octahedral induction, uses the half-open t-structure at the
    common leading phase to identify the decompositions from two filtrations,
    and recurses on the tails. HNFiltration.mass_eq_mass proves equality of all
    HN mass sums. stabilityMass_eq_mass identifies the envelope with every
    finite sum; stabilityMass_ne_top and stabilityMass_eq_zero_iff prove
    finiteness and vanishing exactly on zero objects.

    StabilityCondition/Metric/Distance/Separation.lean closes identity of indiscernibles. From
    distance zero it first reconstructs the slicing, then the charge of every
    object and the observable homomorphism Z.comp v. For a surjective class
    map it reconstructs Z itself and hence the complete stability condition.
    The ordinary K0-valued specialization is unconditional because its class
    map is the identity.

    StabilityCondition/Metric/Distance/Topology.lean closes the analytic and instance-design
    parts of the topology comparison. It proves strict full-distance control
    of phases, masses, and charges; both semistable sector estimates; and the
    unconditional refinement of Section 6 neighborhoods by distance balls.
    From the single explicit proposition StabilityMassTriangleInequality it
    derives the reverse refinement, equality of neighborhood bases, and named
    PseudoEMetricSpace/EMetricSpace structures. Those structures are built by
    PseudoEMetricSpace.ofEDistOfTopology, and rfl regression theorems verify
    that their inherited topology is definitionally the already-installed
    Section 6 topology. No competing global metric instance is installed.

    OPENED 2026-08-06, FIRST AND SECOND MILESTONES CLOSED 2026-08-07: the
    categorical mass-triangle chain.
    StabilityCondition/Metric/Mass/Subadditivity/Triangle.lean defines the ordinary observable stability
    condition with central charge Z.comp v and exposes its induced heart
    stability function and HN property. It proves the charge lower bound
    norm(Z(E)) <= m_sigma(E), mass invariance under shifts by 1 and -1,
    charge additivity on distinguished triangles, and mass subadditivity for
    a semistable middle object or same-phase semistable endpoints. Both base
    cases are transported to short exact sequences in the canonical heart.
    HNFiltration.exists_headTail_mass exposes the octahedral head--tail split
    with its real mass identity. The phase-one boundary-heart and
    semistable-left targets are named explicitly, and
    stabilityMassTriangleInequality_of_semistable_obj₁ proves the
    arbitrary-left target from the semistable-left one by induction on HN
    length. StabilityCondition/Metric/Mass/Subadditivity/Triangle.lean now also proves the missing converse
    heart/slicing semistability implication, converts an abelian HN filtration
    into an ambient HN tower factor by factor, identifies its real mass with
    triangulated stabilityMass, and inhabits the phase-one boundary-heart
    target including zero objects. Code commit 797c200 also inhabits the
    semistable-left target. It proves lifted-rotation invariance of mass,
    strict HN-cut mass splitting, the two-cohomology amplitude formula, the
    six-term H0 kernel/image comparison for a phase-one source, and exact HN
    cutoffs at phases zero and two. A final lifted rotation handles every
    semistable phase. The unrestricted heart short-exact target and the named
    unconditional global triangle corollary are not yet inhabited; no open
    premise is installed as an instance or hidden axiom.

    FOUNDATION UPDATE 2026-08-06: StabilityCondition/Metric/Mass/Subadditivity/HNPolygon.lean now defines the HN polygon as
    the convex hull of all subobject charges and realizes an abelian HN
    filtration as its distinguished complex path. HN polygons are monotone
    under monomorphisms. Consecutive edges are proved equal to factor charges,
    lie in the Bridgeland half-plane, and have strictly decreasing arguments.
    Every interior path vertex is the strict unique maximizer of an explicit
    continuous real-linear functional among path vertices. At code commit
    50c468d this is upgraded to the full ambient HN polygon: a quotient-tail
    HN filtration identifies the phase window below a cut, the canonical map
    S/(S intersection E_k) -> E/E_k is proved monic, and a prefix-quotient
    vanishing argument supplies the opposite phase window. Their charge
    decomposition proves strict support against every other subobject charge,
    and a convex-hull argument proves strict support against every other point
    of the polygon. This completes the interior extremality input from
    Proposition 2.13. Path length remains identified with factor mass, and
    the endpoint chord remains bounded by path length.

    StabilityCondition/Metric/Mass/Subadditivity/PolygonPerimeter.lean now proves the independent t = 0
    polygon-perimeter comparison in Ikeda Lemma 3.7 by a finite support-fan
    argument and specializes it to HN paths. Code commit 10cb4c8 proves the
    precise boundary-cut input for Lemma 3.8: positive-angle support maxima of
    the ambient HN polygon occur on the distinguished HN path, and hence a
    monomorphism A -> B gives m_HN(A) <= m_HN(B) + norm(Z(coker)). The result is
    also stated for arbitrary short exact sequences. The formerly remaining
    first-milestone integration bridge is now closed in
    StabilityCondition/Metric/Mass/Subadditivity/Triangle.lean: abelian factor mass is identified with
    triangulated stabilityMass on the canonical heart, and the zero-object
    cases are explicit.
    StabilityCondition/Metric/Mass/Subadditivity/CohomologyExactness.lean packages the heart-source H0 short complex and
    proves that its exactness is equivalent to monicity of the canonical
    cokernel comparison into H0(X3). Code commit 797c200 proves the canonical
    H0-prime functor homological on arbitrary distinguished triangles by
    truncating to the nonpositive case, then transports that structure to H0.
    Thus the exactness and cokernel-monicity bridges are unconditional, while
    still avoiding a global instance. The first and second mass-triangle
    milestones are both inhabited.

    SECONDARY SOURCE NOTE: this two-stage route is the t = 0 specialization
    of Akishi Ikeda, Mass growth of objects and categorical entropy,
    arXiv:1612.00995. Lemma 3.8 supplies the boundary-heart polygon inequality;
    the proof of Proposition 3.3 then uses the H0 long exact sequence and its
    kernel/image short-exact decompositions. The present files formalize this
    t = 0 route through the semistable-left triangle inequality, including the
    amplitude reduction and both HN cutoffs.

    This still is NOT a completed formalization of Proposition 8.1 or the
    literal Aut(D)-isometry clause of Lemma 8.2. The topology comparison
    remains stated conditionally on the named distinguished-triangle HN-mass
    proposition until the already-proved arbitrary-left reduction is applied
    to the new semistable-left theorem, and AutPairQuot v carries extra
    compatible lattice data. The relevant @[cites] records stay no_claim and
    known_divergences states the boundary precisely.

    The Aut action on SLICINGS is landed, and generally: StabilityCondition/Symmetry/Autoequivalence/Slicing/Transport.lean is the
    transport groundwork (PostnikovTower.mapF, HNFiltration.mapF,
    Slicing.mapEquiv), and StabilityCondition/Symmetry/Autoequivalence/Slicing/Quotient.lean quotients triangulated
    auto-equivalences by natural isomorphism to get an honest Group AutQuot C
    with MulAction (AutQuot C) (Slicing C), both laws proved and nothing
    excluded. StabilityCondition/Symmetry/Autoequivalence/Slicing/Strict.lean remains as the cheaper strict route; it is
    SUPERSEDED for slicings and carries a scope restriction recorded in
    source_mapping -- its F g are isomorphisms of categories, not merely
    equivalences, so Serre functors and spherical twists are outside it. Do not
    cite StrictAut as "the Aut action is formalized"; cite AutQuot. The setoid
    is exactly forward-functor natural isomorphism; inverse isomorphisms are
    derived from uniqueness of right adjoints.

    CLOSED 2026-08-04: the Aut action on STABILITY CONDITIONS is declared --
    StabilityCondition/Symmetry/Autoequivalence/Stability/Transport.lean's actStabAut. All three prerequisites landed: K0
    functoriality (StabilityCondition/Symmetry/Autoequivalence/Foundations/GrothendieckGroup.lean), the class-map compatibility datum (actStabAut's
    lam + hlam arguments), and invariance of strict finite length under an
    equivalence (mapEquiv_isLocallyFinite, resting on the general
    isStrictArtinian_of_faithful_strict in StabilityCondition/Symmetry/Autoequivalence/Foundations/FiniteLength.lean).

    CLOSED 2026-08-04 (later): the Aut action IS a MulAction --
    StabilityCondition/Symmetry/Autoequivalence/Stability/ClassMap.lean. AutPair v bundles the pair (Phi, lam) with its
    compatibility; AutPairQuot v is the quotient by natural isomorphism of Phi
    with lam fixed on the nose, and it is a Group with
    MulAction (AutPairQuot v) (StabilityCondition.WithClassMap C v). Both laws
    proved.

    An earlier revision of this field called that step "packaging, not
    mathematics". That was wrong twice over, and the corrections are the useful
    part. (a) A group needs lam-inverse, and nothing produces one because v is
    arbitrary -- so AutPairQuot requires lam : Lambda ~=+ Lambda where
    actStabAut needs only Lambda ->+ Lambda. That is a STRICTLY STRONGER
    hypothesis, so actStabAut remains the more general statement and is not
    superseded. (b) The inverse's compat needs Phi.functor comp Phi.inverse to
    be the identity ON K0 as an EQUALITY of maps, not merely a natural
    isomorphism; K0.mapF_congr supplies that upgrade. Neither point is
    packaging.

    lam is deliberately NOT quotiented: two lam's over one Phi give different
    charges sigma.Z comp lam whenever v is not surjective, so identifying them
    would make the action ill defined.

    AutPairQuot v is NOT Aut(D), and is further from it than AutQuot: its
    elements are pairs, and toAutQuot is neither injective nor surjective in
    general. See notes/dependencies/BridgelandStabilityAPI.md section 7.

