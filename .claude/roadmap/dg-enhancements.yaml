schema: roadmap/1
slug: dg-enhancements
project: derived-alg-geo-lean
title: "DG enhancements — the H⁰ seam between dg categories and classical derived categories"
status: active
phase: sequenced
brief: |
  Open a second track alongside `stability-families`. Where that track climbs
  from an absolute Bridgeland foundation toward relative moduli, this one
  builds the *other* axis the repository's name promises: the passage between
  a triangulated category and a dg category enhancing it.

  The programme this track reads from is Canonaco–Stellari and
  Canonaco–Neeman–Stellari, fifteen years of work on existence and uniqueness
  of dg enhancements. Its motivating claim — that dg categories are the
  correct ambient objects because naturality of functors falls out of the
  definitions rather than being repaired afterwards — is exactly the kind of
  claim a formalization can test rather than repeat. This roadmap therefore
  treats "the dg side is easier" as a **hypothesis with a falsifiable check**
  (see dg-enhancements-m4 acceptance), not as a premise.

  What the pinned environment already supplies is unusually favourable and is
  the reason this track is filed now rather than parked. One item on the list
  below did not survive measurement: the monoidal structure on complexes does
  NOT reach `CochainComplex (ModuleCat k) ℤ` at the pin, so the enriched
  encoding is unavailable and ADR-0010 decided for a bespoke structure. See the
  `assumptions` block and .claude/notes/2026-08-13-dg-surface-reconnaissance.md.
  At `mathlib_rev` in `pins.json`, Mathlib has: the Hom cochain complex between cochain complexes
  (`Algebra/Homology/HomotopyCategory/HomComplex`, with its shift and
  cohomology files) — which is the dg structure on complexes, already built;
  the monoidal structure on homological complexes (`Algebra/Homology/Monoidal`);
  enriched and enriched-ordinary categories (`CategoryTheory/Enriched`);
  the homotopy category with its pretriangulated and triangulated instances;
  K-projective/K-injective objects; and `DerivedCategory` with a t-structure,
  `Ext`, and fractions. What Mathlib has **none** of is a dg category, a dg
  functor, a quasi-equivalence, or an enhancement. That gap is this track's
  subject, and DG0 measures it declaration by declaration before anything is
  built on the estimate above.

  The track deliberately stops short of the theorems the source papers are
  famous for. Uniqueness of enhancements, intrinsicness of subcategories of
  weakly approximable triangulated categories, and internal Homs in Hqe all
  need machinery — Bousfield localization of dgCat, model structures, Brown
  representability at scale — that does not exist at the pin. Those enter as
  *statements over the formalized definitions* with no inhabitant, on the same
  zero-claim discipline `registry/coverage-*.json` already enforces.

goal:
  hmw: "How might we make a dg enhancement a first-class object in this repository, and make the passage H⁰ between a dg category and a classical triangulated category a proved equivalence rather than an informal identification?"
  objective: "Formalize dg categories, dg functors, H⁰, and enhancements at the pin; prove that the h-injective dg category of complexes enhances Mathlib's DerivedCategory; and expose a transport API that carries t-structures, slicings, and stability conditions across that equivalence in both directions."
  key_results:
    - "A dg category and a dg functor are definable at the pin with k-linearity explicit, no new axiom, and no sorry."
    - "H⁰ is a functor, is additive, and satisfies H⁰(C^dg A) ≌ HomotopyCategory A — proved, not asserted."
    - "A pretriangulated dg category transports a triangulated structure to its H⁰, and on K^dg(A) the transported structure is proved to agree with Mathlib's existing instance rather than merely to exist."
    - "DerivedCategory A has a constructed, non-vacuous enhancement, compatible with shift, distinguished triangles, and Ext."
    - "A t-structure, a slicing, and a pre-stability condition each transport across an enhancement equivalence with round-trip identities proved, so a Bridgeland-side statement can be made on either side of the seam."
    - "Every uniqueness-of-enhancements statement is a Prop over the formalized definitions with no inhabitant, and every source coordinate stays `target` until reviewed evidence promotes it."
  assumptions:
    - tier: must
      text: "A dg category is expressible at the pin as a category enriched over cochain complexes of k-modules, using CategoryTheory/Enriched/Ordinary together with Algebra/Homology/Monoidal."
      status: refuted
      validation: "REFUTED 2026-08-13 against mathlib_rev. `HomologicalComplex.HasTensor` does not synthesize for `CochainComplex (ModuleCat k) ℤ`; the degree-n tensor is a coproduct over the infinite set {(i,j) : i+j=n} and only the finite-fibre instances exist. `ChainComplex (ModuleCat k) ℕ` IS monoidal, which localizes the gap. Evidence and probes: .claude/notes/2026-08-13-dg-surface-reconnaissance.md. ADR-0010 Question 1 therefore decided for Option B (bespoke DGCategory); the enriched route survives as Option A′, an upstreamable ForMathlib slice that blocks nothing in DG1."
    - tier: must
      text: "Mathlib's HomComplex API is complete enough to give C^dg(A) without re-deriving the Hom complex."
      status: confirmed
      validation: "CONFIRMED 2026-08-13, and stronger than stated: besides `Cochain`, `Cochain.comp`, `δ`, `Cocycle` and `CochainComplex.HomComplex`, the pin already proves `CohomologyClass.homAddEquiv : Hⁿ(Hom•(K,L)) ≅+ Hom_{K(C)}(K, L⟦n⟧)`. The seam theorem of e4 is packaging, not construction. Evidence: .claude/notes/2026-08-13-dg-surface-reconnaissance.md."
    - tier: should
      text: "The h-injective (respectively h-projective) model of the derived enhancement is reachable before the Drinfeld dg quotient is."
      validation: "Mathlib already builds DerivedCategory through KInjective/KProjective. If the seam theorem cannot be closed on that model, the Drinfeld quotient epic un-parks and the milestone slips rather than the claim weakening."
    - tier: should
      text: "Transport across an enhancement equivalence makes at least one functor-naturality obligation cheaper than its classical proof."
      validation: "dg-enhancements-e12 must exhibit one such lemma with both proofs, or record the negative result in the roadmap and in the epic. A negative result retires the m4 rationale; it does not get quietly dropped."
  wont:
    - "No model structure on dgCat, no Tabuada machinery, no Bousfield localization of dg categories."
    - "No ∞-categorical enhancement, no comparison between dg and stable-∞ enhancements."
    - "No claim that a triangulated category not constructed in this repository admits an enhancement, and no existence claim from a uniqueness statement."
    - "No axiom, sorry-backed instance, or vacuous structure to make a source definition typecheck — the repository rule stands unchanged for this track."
    - "No replacement of Mathlib's DerivedCategory. The seam theorem compares the two objects; it does not fork one of them."
    - "No modification to formalization.yaml's `source` and no new key minted outside registry/bridgeland2007.json."
  evidence:
    - "arXiv:1507.05509v5 — Canonaco–Stellari, 'Uniqueness of dg enhancements for the derived category of a Grothendieck category', JEMS 20 (2018) 2607–2641."
    - "arXiv:2101.04404v1 — Canonaco–Neeman–Stellari, 'Uniqueness of enhancements for derived and geometric categories'."
    - "arXiv:2402.04605v1 — Canonaco–Haesemeyer–Neeman–Stellari, 'The passage among the subcategories of weakly approximable triangulated categories'."
    - "arXiv:2407.05946v2 — Canonaco–Neeman–Stellari, survey, to appear in Boll. Unione Mat. Ital."
    - "arXiv:1312.5619v3 — Canonaco–Stellari, 'Internal Homs via extensions of dg functors', Adv. Math. 277 (2015) 100–123."
    - "Pinned Mathlib surface: Algebra/Homology/HomotopyCategory/HomComplex{,Shift,Cohomology,Single,Induction}, Algebra/Homology/Monoidal, CategoryTheory/Enriched/{Basic,EnrichedCat,Ordinary/Basic}, Algebra/Homology/DerivedCategory/{Basic,TStructure,KInjective,KProjective,Ext/*}, CategoryTheory/Localization/*, CategoryTheory/Triangulated/*."
    - "Absence measured, not assumed: no declaration matching DifferentialGraded/DGCategory/quasi-equivalence exists at the pin. DG0 re-runs this search against `mathlib_rev` exactly and records the command and its output."
    - "ARCHITECTURE.md growth rule 1 and CLAUDE.md's repository taxonomy: 'Future derived-category and Fourier–Mukai libraries get dedicated roots with their first real theorem.'"

